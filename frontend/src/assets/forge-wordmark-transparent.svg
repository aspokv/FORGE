    <g transform="translate(94 15)">
      <path d="M31 2c7 12 5 22 1 29 8-4 13-11 14-20 11 12 18 25 14 39-4 15-16 27-31 31C14 77 4 67 2 54 0 42 7 30 17 20c-1 8 1 14 7 19 0-13 2-25 7-37z" fill="url(#flame)"/>
      <path d="M31 31c6 8 7 14 4 20-3 6-8 10-14 12 1-6-2-11-7-15 4-7 10-12 17-17z" fill="#171414" opacity=".95"/>
    </g>
  </g>
