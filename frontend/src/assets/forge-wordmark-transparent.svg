<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 118" role="img" aria-labelledby="title desc">
  <title id="title">FORGE</title>
  <desc id="desc">Logotipo oficial FORGE em metal cobre e laranja, com fundo transparente.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff0da"/>
      <stop offset=".16" stop-color="#f7c18a"/>
      <stop offset=".43" stop-color="#ff9a52"/>
      <stop offset=".70" stop-color="#cf6328"/>
      <stop offset="1" stop-color="#793012"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8eb"/>
      <stop offset=".38" stop-color="#ffc370"/>
      <stop offset="1" stop-color="#ff6f30"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-35%" width="130%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000000" flood-opacity=".58"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.1" flood-color="#ff8a42" flood-opacity=".22"/>
    </filter>
  </defs>
  <g filter="url(#shadow)" transform="skewX(-6)">
