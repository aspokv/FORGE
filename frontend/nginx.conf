server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload de fotos do visual assessment (POST /api/visual-assessment)
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker: resolve "backend" a cada request, para que
    # um restart do backend (IP novo) nao derrube o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $forge_backend http://backend:8000;
        proxy_pass $forge_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Coach streaming (SSE em POST /api/coach): sem buffer, sem timeout curto
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Bundles com hash no nome: cache agressivo
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html nunca em cache, senao o deploy novo nao aparece
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
