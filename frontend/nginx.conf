server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nao anunciar a versao do nginx.
    server_tokens off;

    # Cabecalhos de seguranca.
    #
    # "always" faz valer tambem em resposta de erro, que e onde faltar cabecalho costuma
    # doer. Eles aparecem repetidos nas duas locations abaixo de proposito: no nginx, um
    # add_header dentro de location SUBSTITUI os herdados do server, entao sem repetir,
    # /static/ e /index.html ficariam sem protecao nenhuma.
    #
    # A CSP libera o que a aplicacao realmente usa: Google Fonts (folha e arquivo),
    # estilo inline (o React aplica style= em varios pontos) e imagem em data:/blob:
    # (previa de foto no visual assessment). O checkout do Mercado Pago e navegacao de
    # primeiro nivel, nao requisicao, entao nao precisa entrar em connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Upload de fotos do visual assessment (POST /api/visual-assessment)
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # DNS interno do Docker: resolve "backend" a cada request, para que
    # um restart do backend (IP novo) nao derrube o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api {
        set $forge_backend http://backend:8000;
        proxy_pass $forge_backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # Coach streaming (SSE em POST /api/coach): sem buffer, sem timeout curto
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # Bundles com hash no nome: cache agressivo
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # index.html nunca em cache, senao o deploy novo nao aparece.
    # Os cabecalhos de seguranca sao repetidos porque um add_header dentro de location
    # substitui os herdados do server — sem isto, a propria pagina ficaria sem CSP.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
