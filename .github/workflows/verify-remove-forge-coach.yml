name: Verify Remove Forge Coach

on:
  push:
    branches:
      - ui/remove-forge-coach
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/remove-forge-coach
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Remove Coach UI and replace Home entry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('frontend/src/App.js')
          text = path.read_text(encoding='utf-8')

          text = text.replace('BookOpen,BrainCircuit,Check', 'BookOpen,Check')
          text = text.replace('Sliders,Sparkles,TimerReset', 'Sliders,TimerReset')

          text = text.replace(',[coach,setCoach]=useState(false),[coachText,setCoachText]=useState(""),[busy,setBusy]=useState(false)', '')

          pattern = re.compile(r';const context=useMemo\(\(\)=>\{.*?\};const finish=', re.S)
          text, count = pattern.subn(';const finish=', text, count=1)
          assert count == 1, f'coach state/request block replacement count={count}'

          text = text.replace('openCoach={()=>setCoach(true)}', 'openAnalysis={()=>setTab("Análise")}')
          text = text.replace('{coach&&<Coach onClose={()=>setCoach(false)}text={coachText}busy={busy}ask={ask}/>}','')

          text = text.replace('function Page({tab,db,analytics,report,techniques,start,openCoach,openBuilder,openManual,onLibraryBuild,onLibraryTemplateAdd,openTech,redo,signOut,user,goHome,onExerciseSubstituted,onWorkoutCompleted,onRecoveryCheckin})',
                              'function Page({tab,db,analytics,report,techniques,start,openAnalysis,openBuilder,openManual,onLibraryBuild,onLibraryTemplateAdd,openTech,redo,signOut,user,goHome,onExerciseSubstituted,onWorkoutCompleted,onRecoveryCheckin})')
          text = text.replace('return <Analysis db={db}analytics={analytics}report={report}openCoach={openCoach}/>', 'return <Analysis db={db}analytics={analytics}report={report}/>')
          text = text.replace('return <Today db={db}analytics={analytics}report={report}start={start}openCoach={openCoach}openBuilder={openBuilder}openManual={openManual}onRecoveryCheckin={onRecoveryCheckin}/>',
                              'return <Today db={db}analytics={analytics}report={report}start={start}openAnalysis={openAnalysis}openBuilder={openBuilder}openManual={openManual}onRecoveryCheckin={onRecoveryCheckin}/>')

          text = text.replace('function Today({db,analytics,report,start,openCoach,openBuilder,openManual,onRecoveryCheckin})',
                              'function Today({db,analytics,report,start,openAnalysis,openBuilder,openManual,onRecoveryCheckin})')

          old_home = '''    <section className="home-coach-pro" data-testid="home-coach-pro">
      <div className="home-coach-orbit"><BrainCircuit size={32}/><i/><i/><i/></div>
      <div><p>COACH IA PRO · INCLUÍDO NO SEU PLANO</p><h3>{checkin?"Seu plano está ajustado à sua recuperação.":"Seu próximo nível começa agora."}</h3><span>Treino, nutrição e progressão com o contexto completo do seu ciclo.</span></div>
      <button type="button" onClick={openCoach}>Falar com o Coach <ChevronRight size={16}/></button>
    </section>'''
          new_home = '''    <section className="home-coach-pro home-cycle-status" data-testid="home-cycle-status">
      <div className="home-coach-orbit"><Activity size={32}/><i/><i/><i/></div>
      <div><p>FORGE STATUS · DADOS DO CICLO</p><h3>{report?.headline||checkin?"Seu ciclo já tem sinais para revisar.":"Veja o que seu treino está produzindo."}</h3><span>Volume, recuperação, frequência e tendências reunidos em uma leitura objetiva.</span></div>
      <button type="button" onClick={openAnalysis}>Abrir análise <ChevronRight size={16}/></button>
    </section>'''
          assert old_home in text, 'Home Coach card marker missing'
          text = text.replace(old_home, new_home, 1)

          text = text.replace('function Analysis({db,analytics,report,openCoach})', 'function Analysis({db,analytics,report})')
          coach_button = '<button className="secondary-button"data-testid="analysis-coach-button"onClick={openCoach}><BrainCircuit size={17}/> Analisar com Forge Coach</button>'
          assert coach_button in text, 'analysis coach button marker missing'
          text = text.replace(coach_button, '', 1)

          start = text.find('function Coach({onClose,text,busy,ask})')
          end = text.find('function DeepAssessment(', start)
          assert start >= 0 and end > start, 'Coach component markers missing'
          text = text[:start] + text[end:]

          assert 'FORGE COACH' not in text
          assert 'openCoach' not in text
          assert 'coachText' not in text
          assert 'setCoach' not in text
          assert 'Lendo assessment e histórico' not in text
          assert 'home-cycle-status' in text
          assert 'openAnalysis={()=>setTab("Análise")}' in text

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add frontend/src/App.js
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ui): remove Forge Coach and surface cycle status"
            git push origin HEAD:ui/remove-forge-coach
          fi
