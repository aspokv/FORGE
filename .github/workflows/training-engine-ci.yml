jobs:
  training-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile training engine, cardio, and custom library modules
        run: python -m py_compile engine.py female_program_selector.py training_engine_v4.py training_engine_v5.py muscles.py cardio.py cardio_routes.py training_programs.py custom_training_programs.py runtime_server.py
      - name: Run V5 training regression suite
        run: >-
          pytest -q --noconftest
          tests/test_training_engine_v5.py
          tests/test_training_personalization.py
          tests/test_engine_v2.py
          tests/test_engine_v3.py
          tests/test_exercise_photo_coverage.py
          tests/test_custom_training_programs.py
          test_cardio_unit.py
          tests/test_workout_completion_state.py
          tests/test_workout_calendar.py
          tests/test_female_program_selector.py
          tests/test_female_program_selection.py

  workout-library-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Test mobile workout, home, progress, artwork, and cardio UI
        run: FORGE_ARTWORK_VISUAL=1 CI=true yarn test --watchAll=false --runTestsByPath src/features/WorkoutLibrary.interaction.test.js src/features/ReferenceHome.artwork.test.js src/features/progressVisual.test.js src/features/exerciseArtworkLibrary.test.js src/features/CardioFinisher.test.js src/features/trainingCardArtwork.test.js src/features/trainingCardAssets.test.js src/features/ReferenceWorkoutPreview.content.test.js src/features/ExerciseEvolution.test.js src/features/workoutCompletionState.test.js src/features/completeWorkout.test.js src/features/workoutCalendar.test.js
      - name: Build frontend
        env:
          CI: 'false'
        run: yarn build
      - name: Upload rendered training cards for visual review
        uses: actions/upload-artifact@v4
        with:
          name: training-card-visual
          path: frontend/training-card-visual
          retention-days: 7

  seguranca:
    # Os 40 testes de seguranca — IDOR, mass assignment, injecao de operador do Mongo no
    # login, JWT sem assinatura e com assinatura adulterada, escopo de admin, allowlist de
    # upload, limite de corpo e a lista de rotas alcancaveis sem pagamento — existiam no
    # repositorio e NINGUEM os executava: nao estavam em nenhum job. Um deles vivia
    # vermelho na main sem que isso aparecesse em lugar nenhum.
    #
    # A suite precisa de Mongo de verdade porque o conftest semeia contas e os testes de
    # IDOR dependem de dois atletas existirem. O conftest recusa rodar se DB_NAME nao
    # parecer banco de teste, o que impede apontar isto para producao por engano.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_database
      FORGE_JWT_SECRET: apenas-para-o-ci-nunca-usar-em-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run security suite
        run: pytest -q tests/test_seguranca.py
