      - 'backend/tests/test_substituicao_exercicio.py'
      - 'frontend/src/features/Swap.test.js'
      - 'frontend/src/features/AdminPanel.remocao.test.js'
      - 'frontend/src/features/AdminPanel.planos.test.js'
      - 'frontend/src/features/AdminPanel.conceder.test.js'
      - 'frontend/src/features/conselho.css'
      # Estava de fora: a varredura que exige pagamento em TODA rota mora aqui, e um teste
      # dela tinha ficado vermelho sem ninguem ver quando o agressivo desceu para o Pro.
      - 'backend/tests/test_billing_api.py'
      - 'frontend/src/features/Conselho.jsx'
      - 'frontend/src/features/Conselho.test.js'
      - 'frontend/src/features/AstraProgress.jsx'
      - 'frontend/src/features/AstraProgress.conselho.test.js'
      - 'frontend/src/features/conselho.css'
      - '.github/workflows/training-engine-ci.yml'

jobs:
  training-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile training engine, cardio, and custom library modules
        run: python -m py_compile engine.py female_program_selector.py training_engine_v4.py training_engine_v5.py muscles.py cardio.py cardio_routes.py training_programs.py custom_training_programs.py runtime_server.py hybrid_metadata.py training_engine_hybrid.py food_card.py food_card_routes.py
      - name: Run V5 training regression suite
        run: >-
          pytest -q --noconftest
          tests/test_training_engine_v5.py
          tests/test_training_personalization.py
          tests/test_engine_v2.py
          tests/test_engine_v3.py
          tests/test_exercise_photo_coverage.py
          tests/test_custom_training_programs.py
          test_cardio_unit.py
          tests/test_workout_completion_state.py
          tests/test_workout_calendar.py
          tests/test_troca_de_dia.py
          tests/test_female_program_selector.py
          tests/test_female_program_selection.py

  workout-library-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Test mobile workout, home, progress, artwork, and cardio UI
        run: TZ=UTC FORGE_ARTWORK_VISUAL=1 CI=true yarn test --watchAll=false
      - name: Build frontend
        env:
          CI: 'false'
        run: yarn build
      # A landing e um pacote separado (Vite + Three.js) e o Dockerfile a constroi junto.
      # Sem este passo, um erro nela so apareceria no deploy, com o site fora do ar.
      - name: Build landing
        working-directory: frontend/landing
        run: npm ci --no-audit --no-fund && npm run build
      # O gerador do briefing de arte le o catalogo de exercicios e o de fotos. Roda aqui
      # por um motivo so: ele PROMETE ser deterministico, e a promessa importa — uma
      # regeneracao parcial que trocasse o sexo do modelo de exercicios que ja tem arte
      # pronta desfaria a mistura masculino/feminino sem ninguem perceber. Duas execucoes
      # e um diff provam isso; sem o passo, o script subiria sem check nenhum.
      - name: Check the exercise art brief generator
        working-directory: .
        run: |
          python3 scripts/gerar-markdown-exercicios.py /tmp/brief-a.md
          python3 scripts/gerar-markdown-exercicios.py /tmp/brief-b.md
          diff /tmp/brief-a.md /tmp/brief-b.md
          python3 - <<'CONFERE'
          import io, json
          catalogo = json.load(io.open("backend/exercises.json", encoding="utf-8"))
          md = io.open("/tmp/brief-a.md", encoding="utf-8").read()
          fora = [e["id"] for e in catalogo if e["id"] not in md]
          assert not fora, "exercicios fora do briefing: %s" % fora[:5]
          assert "**%d exerc" % len(catalogo) in md, "o briefing nao declara os %d do catalogo" % len(catalogo)
          print("briefing cobre os %d exercicios do catalogo" % len(catalogo))
          CONFERE
      - name: Upload rendered training cards for visual review
        uses: actions/upload-artifact@v4
        with:
          name: training-card-visual
          path: frontend/training-card-visual
          retention-days: 7

  seguranca:
    # Os 40 testes de seguranca — IDOR, mass assignment, injecao de operador do Mongo no
    # login, JWT sem assinatura e com assinatura adulterada, escopo de admin, allowlist de
    # upload, limite de corpo e a lista de rotas alcancaveis sem pagamento — existiam no
    # repositorio e NINGUEM os executava: nao estavam em nenhum job. Um deles vivia
    # vermelho na main sem que isso aparecesse em lugar nenhum.
    #
    # A suite precisa de Mongo de verdade porque o conftest semeia contas e os testes de
    # IDOR dependem de dois atletas existirem. O conftest recusa rodar se DB_NAME nao
    # parecer banco de teste, o que impede apontar isto para producao por engano.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: .
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: test_database
      FORGE_JWT_SECRET: apenas-para-o-ci-nunca-usar-em-producao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run security suite
        run: pytest -q tests/test_seguranca.py
      # Mora aqui, e nao no job de unidade, por uma razao mecanica: o teste importa
      # `server`, e `server` exige MONGO_URL no import. Este job ja sobe o Mongo.
      - name: Run vision resilience suite
        run: pytest -q tests/test_analise_visual_resiliente.py
      # Mesma razao do de cima: usa o app em processo, que exige MONGO_URL no import. Cobre
      # a rota que alimenta a Evolucao com a ultima carga de cada exercicio, incluindo o
      # isolamento entre atletas.
      - name: Run session last performance suite
        run: pytest -q tests/test_session_last_performance.py
      # Mesma razao das duas de cima: importa `server`. Mede o preflight de CORS, que e o
      # que decide se um PUT de outra origem chega a SAIR do navegador. Faltava PUT na
      # lista e toda troca de objetivo morria antes da requisicao.
      - name: Run CORS preflight suite
        run: pytest -q tests/test_cors_preflight.py
      # O marcador de deploy do backend. Mora ao lado do CORS porque os dois medem a
      # superficie PUBLICA da API: o que responde sem login, e o que sai na resposta.
      #
      # O teste que sustenta o marcador e o da estabilidade entre duas requisicoes. Trocar
      # `SUBIU_EM` por `datetime.now()` dentro da rota deixaria o campo com a mesma
      # aparencia e sem nenhum valor: mudaria a cada chamada, e comparar com o horario do
      # merge nao provaria mais nada. A suite tambem cobra `runtime_server`, que e o modulo
      # que o Dockerfile sobe.
      - name: Run deploy marker suite
        run: pytest -q tests/test_marcador_de_deploy.py
      # Trocar o dia de treino. Mora aqui porque precisa de Mongo: o teste que importa e o
      # da CONCLUSAO no dia trocado, e ele so existe de ponta a ponta — a rota recusa com
      # 409 uma sessao que nao bate com o calendario do dia, e sem a troca chegar la o
      # atleta treinaria no dia adiantado e seria impedido de concluir.
      - name: Run day swap suite
        run: pytest -q tests/test_troca_de_dia_api.py
      # Escolher qual sessao treinar hoje. Tambem precisa de Mongo pelo mesmo motivo: o
      # teste que importa e o da CONCLUSAO da sessao escolhida — o compare-and-swap do
      # ponteiro so deixa concluir quem o tem parado na sessao concluida, e quem escolheu
      # outra tem o ponteiro legitimamente noutro lugar.
      - name: Run session choice suite
        run: pytest -q tests/test_escolha_da_sessao_api.py
      # O Conselho: a decisao pura roda sem banco; a de ponta a ponta usa o Mongo deste
      # job. `test_billing_api` entra junto porque e ela que varre toda rota paga, e o
      # portao do Conselho e uma delas.
      - name: Run weekly council suites
        run: >-
          pytest -q --noconftest tests/test_conselho.py
      - name: Run weekly council API and billing sweep
        run: pytest -q tests/test_conselho_api.py tests/test_billing_api.py
      # A leitura semanal e gravada para TODO atleta, e uma vez so por semana. O indice
      # unico (profile_id, semana) e o que impede a corrida do bootstrap de duplicar a
      # serie em silencio — medido: dez aberturas rapidas gravavam tres linhas.
      - name: Run weekly council recording suite
        run: pytest -q tests/test_conselho_registro.py
      # O diario livre usa o MESMO vocabulario de refeicao do motor de nutricao. Duas
      # taxonomias no mesmo produto viram dois relatorios que nao batem, e a suite cobra
      # isso comparando as duas listas.
      - name: Run free food diary suite
        run: pytest -q tests/test_diario_livre.py
      # O painel administrativo concede plano de verdade: cada caso termina batendo numa
      # rota paga com o token do atleta, porque "a rota devolveu 200" nao prova acesso.
      - name: Run admin plan grant suite
        run: pytest -q tests/test_admin_planos.py
      # Excluir atleta apaga de trinta colecoes. A suite semeia dado em TODAS as colecoes
      # do banco e varre tudo depois: colecao esquecida vira dado orfao, e dado orfao nao
      # levanta erro nenhum — so fica la com o nome de quem pediu para ser apagado.
      - name: Run admin archive and delete suite
        run: pytest -q tests/test_admin_remocao.py
      # Substituir exercicio nao tinha NENHUMA cobertura no CI: a suite antiga
      # (`test_exercise_substitution.py`) fala com um servidor HTTP de verdade e por isso
      # nunca entrou nos `paths:`. Foi assim que tres defeitos chegaram a producao. Esta
      # roda em processo.
      - name: Run exercise substitution suite
        run: pytest -q tests/test_substituicao_exercicio.py
      # Cardio e observacao por exercicio. A suite de cardio prende a regra que separa o
      # FORGE de um contador de calorias: o numero do painel da esteira NUNCA vira credito
      # de comida, porque o alvo calorico ja nasce de um TDEE com fator de atividade e
      # somar de novo conta o mesmo gasto duas vezes, com um numero ja inflado.
      - name: Run cardio suite
        run: pytest -q tests/test_cardio.py
      # A observacao e idempotente por (perfil, exercicio, dia): a tela salva enquanto a
      # pessoa digita, e sem o indice unico cada toque viraria uma linha.
      - name: Run exercise note suite
        run: pytest -q tests/test_observacao_de_exercicio.py
      # Hybrid Training Engine. O metadado e a decisao pura rodam sem banco: regiao,
      # demanda de biceps e estresse articular sao DERIVADOS do catalogo em vez de
      # cadastrados, e a suite cobra os 134 exercicios de uma vez — um exercicio sem
      # regiao nunca entra numa rotacao de vetor e some da prescricao sem levantar erro.
      - name: Run hybrid engine suites
        run: >-
          pytest -q --noconftest
          tests/test_hybrid_metadata.py
          tests/test_hybrid_engine.py
      # De ponta a ponta, contra `runtime_server` — que e o modulo que o Dockerfile sobe e
      # onde o hibrido e instalado. Testar contra `server:app` provaria que o motor
      # funciona numa aplicacao que ninguem executa.
      - name: Run hybrid end-to-end suite
        run: pytest -q tests/test_hybrid_api.py
      # Forge Food Card. A decisao pura (icone, macro principal, descricao, posicao) roda
      # sem banco. O teste que importa aqui e o que compara o card com a refeicao de
      # ORIGEM: a peca sai com o nome do FORGE e vai para o Instagram do atleta, e um
      # numero recalculado no caminho seria uma peca publicada que nao bate com o diario.
      - name: Run food card suite
        run: pytest -q --noconftest tests/test_food_card.py
      - name: Run food card API suite
        run: pytest -q tests/test_food_card_api.py
      - name: Run library program suite
        run: >-
          pytest -q --noconftest
          tests/test_programa_hibrido_6x.py
          tests/test_workout_templates.py
          tests/test_alimentos_do_diario.py
          tests/test_lista_de_compras.py
          tests/test_ciclagem_de_carboidrato.py
          tests/test_metodo_do_treinador.py
          tests/test_billing_plans.py
          tests/test_food_plan_search.py
          tests/test_ritmo_bloqueado.py
          tests/test_prato_do_metodo.py
          tests/test_escolha_humana.py
          tests/test_receitas.py
      # As suites de COMPOSICAO de nutricao: como o prato e montado, como a refeicao e
      # nomeada, como a meta se distribui. Rodam sem servidor e levam menos de dois
      # segundos juntas. Nunca estiveram no CI — e foi uma delas que pegou o acento
      # entrando no nome da refeicao e quebrando o casamento com o template.
      - name: Run nutrition composition suites
        run: >-
          pytest -q --noconftest
          tests/test_nutrition.py
          tests/test_nutrition_altura_em_metros.py
          tests/test_nutrition_directional.py
          tests/test_nutrition_dna.py
          tests/test_nutrition_guided_carb_ceiling.py
          tests/test_nutrition_guided_flow.py
          tests/test_nutrition_import.py
          tests/test_nutrition_meal_type_and_import_guard.py
          tests/test_nutrition_meta_segue_questionario.py
          tests/test_imported_targets_regression.py
          tests/test_nutrition_periodization.py
          tests/test_nutrition_portion_hierarchy.py
          tests/test_nutrition_real_meal_composition.py
          tests/test_nutrition_substitution_dna.py
          tests/test_food_substitution.py
          tests/test_montagem_por_alimento.py
          tests/test_prioridades_musculares.py
          tests/test_recomendar_da_biblioteca.py
