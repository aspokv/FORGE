      - 'frontend/src/features/cardio-finisher.css'
      - 'frontend/src/features/CardioFinisher.test.js'
      - 'frontend/src/features/WorkoutLibrary.jsx'
      - 'frontend/src/features/workout-library.css'
      - 'frontend/src/features/WorkoutLibrary.interaction.test.js'
      - 'frontend/src/features/ReferenceWorkoutPreview.jsx'
      - 'frontend/src/features/exerciseArtworkLibrary.js'
      - 'frontend/src/features/reviewedExerciseArtwork.js'
      - 'frontend/src/features/exercisePhotoCatalog.json'
      - 'frontend/src/features/ExercisePhoto.jsx'
      - 'frontend/src/features/ManualWorkout.jsx'
      - 'frontend/src/features/ProgramBuilder.jsx'
      - 'frontend/src/features/exerciseArtwork.test.js'
      - 'backend/tests/test_exercise_photo_coverage.py'
