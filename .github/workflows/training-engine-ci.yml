name: Training Engine CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/server.py'
      - 'backend/workout_templates.py'
      - 'backend/engine.py'
      - 'backend/training_engine_v4.py'
      - 'backend/training_engine_v5.py'
      - 'backend/muscles.py'
      - 'backend/exercises.json'
      - 'backend/tests/test_training_engine_v5.py'
      - 'backend/tests/test_training_personalization.py'
      - 'frontend/src/App.js'
      - 'frontend/src/index.css'
      - 'frontend/src/features/WorkoutLibrary.jsx'
      - 'frontend/src/features/workout-library.css'
      - 'frontend/src/features/WorkoutLibrary.interaction.test.js'
      - 'frontend/src/features/ReferenceHome.jsx'
      - 'frontend/src/features/ReferenceHome.artwork.test.js'
      - 'frontend/src/features/product-layout.css'
      - 'frontend/src/features/progressVisual.test.js'
      - 'frontend/src/home-hero-card.css'
      - '.github/workflows/training-engine-ci.yml'
  pull_request:
    paths:
      - 'backend/server.py'
      - 'backend/workout_templates.py'
      - 'backend/engine.py'
      - 'backend/training_engine_v4.py'
      - 'backend/training_engine_v5.py'
      - 'backend/muscles.py'
      - 'backend/exercises.json'
      - 'backend/tests/test_training_engine_v5.py'
      - 'backend/tests/test_training_personalization.py'
      - 'frontend/src/App.js'
      - 'frontend/src/index.css'
      - 'frontend/src/features/WorkoutLibrary.jsx'
      - 'frontend/src/features/workout-library.css'
      - 'frontend/src/features/WorkoutLibrary.interaction.test.js'
      - 'frontend/src/features/ReferenceHome.jsx'
      - 'frontend/src/features/ReferenceHome.artwork.test.js'
      - 'frontend/src/features/product-layout.css'
      - 'frontend/src/features/progressVisual.test.js'
      - 'frontend/src/home-hero-card.css'
      - '.github/workflows/training-engine-ci.yml'

jobs:
  training-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile training engine
        run: python -m py_compile engine.py training_engine_v4.py training_engine_v5.py muscles.py
      - name: Run V5 training regression suite
        run: >-
          pytest -q --noconftest
          tests/test_training_engine_v5.py
          tests/test_training_personalization.py
          tests/test_engine_v2.py
          tests/test_engine_v3.py

  workout-library-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Test mobile workout, home, and progress UI
        run: CI=true yarn test --watchAll=false --runTestsByPath src/features/WorkoutLibrary.interaction.test.js src/features/ReferenceHome.artwork.test.js src/features/progressVisual.test.js
      - name: Build frontend
        env:
          CI: 'false'
        run: yarn build