      - 'frontend/src/features/TrainingCardImage.jsx'
      - 'frontend/src/features/training-card-artwork.css'
      - 'frontend/src/assets/training-cards/**'
      - 'frontend/src/features/ReferenceHome.jsx'
      - 'frontend/src/features/ReferenceHome.artwork.test.js'
      - 'frontend/src/features/product-layout.css'
      - 'frontend/src/features/progressVisual.test.js'
      - 'frontend/src/home-hero-card.css'
      - '.github/workflows/training-engine-ci.yml'

jobs:
  training-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile training engine, cardio, and custom library modules
        run: python -m py_compile engine.py training_engine_v4.py training_engine_v5.py muscles.py cardio.py cardio_routes.py training_programs.py custom_training_programs.py runtime_server.py
      - name: Run V5 training regression suite
        run: >-
          pytest -q --noconftest
          tests/test_training_engine_v5.py
          tests/test_training_personalization.py
          tests/test_engine_v2.py
          tests/test_engine_v3.py
          tests/test_exercise_photo_coverage.py
          tests/test_custom_training_programs.py
          test_cardio_unit.py

  workout-library-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
      - name: Test mobile workout, home, progress, artwork, and cardio UI
        run: FORGE_ARTWORK_VISUAL=1 CI=true yarn test --watchAll=false --runTestsByPath src/features/WorkoutLibrary.interaction.test.js src/features/ReferenceHome.artwork.test.js src/features/progressVisual.test.js src/features/exerciseArtworkLibrary.test.js src/features/CardioFinisher.test.js src/features/trainingCardArtwork.test.js src/features/trainingCardAssets.test.js src/features/ReferenceWorkoutPreview.content.test.js
      - name: Build frontend
        env:
          CI: 'false'
        run: yarn build
      - name: Upload rendered training cards for visual review
        uses: actions/upload-artifact@v4
        with:
          name: training-card-visual
          path: frontend/training-card-visual
          retention-days: 7
