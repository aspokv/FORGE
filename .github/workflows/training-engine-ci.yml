      - 'backend/cardio_routes.py'
      - 'backend/test_cardio_unit.py'
      - 'backend/workout_templates.py'
      - 'backend/training_programs.py'
      - 'backend/custom_training_programs.py'
      - 'backend/engine.py'
      - 'backend/training_engine_v4.py'
      - 'backend/training_engine_v5.py'
      - 'backend/muscles.py'
      - 'backend/exercises.json'
      - 'backend/tests/test_training_engine_v5.py'
      - 'backend/tests/test_training_personalization.py'
      - 'backend/tests/test_custom_training_programs.py'
      - 'frontend/src/App.js'
      - 'frontend/src/index.js'
      - 'frontend/src/index.css'
