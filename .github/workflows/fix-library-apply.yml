name: Fix Library Apply
on:
  push:
    branches:
      - fix/library-apply-action
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-apply-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Apply patch
        run: python scripts/fix_library_apply.py
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Assert fix
        run: |
          grep -q 'library-apply-inline-status' frontend/src/features/WorkoutLibrary.jsx
          grep -q 'training-current-tab' frontend/src/features/WorkoutLibrary.jsx
          grep -q 'aria-live="polite"' frontend/src/features/WorkoutLibrary.jsx
      - name: Commit fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add frontend/src/features/WorkoutLibrary.jsx
          git commit -m "fix(training): make library apply action explicit"
          git push origin HEAD:fix/library-apply-action
