name: Verify Library Active Session

on:
  push:
    branches:
      - fix/library-active-session
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-active-session
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Apply library active-session fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          library = Path('frontend/src/features/WorkoutLibrary.jsx')
          text = library.read_text(encoding='utf-8')

          template_marker = '''export const templateToSession = (template, day) => ({
            day,
            label: template.name,
            demand: template.demand || "MODERATE",
            focus: [...(template.focus || [])],
            exercises: (template.exercises || []).map(exercise => ({ ...exercise })),
            template_id: template.id,
          });

          export const buildLibraryProgram'''
          template_replacement = '''export const templateToSession = (template, day) => ({
            day,
            label: template.name,
            demand: template.demand || "MODERATE",
            focus: [...(template.focus || [])],
            exercises: (template.exercises || []).map(exercise => ({ ...exercise })),
            template_id: template.id,
          });

          export const replaceActiveSessionWithTemplate = (program, template, activeDay) => {
            const sessions = (program?.sessions || []).map(session => ({
              ...session,
              exercises: (session.exercises || []).map(exercise => ({ ...exercise })),
            }));
            const targetDay = Number(activeDay ?? program?.active_day ?? sessions[0]?.day ?? 1);
            if (!sessions.length) return [templateToSession(template, targetDay || 1)];

            // A versão anterior anexava a sessão escolhida no fim da semana. Se essa cópia
            // ainda existir, retire apenas esse último duplicado antes de substituir o dia ativo.
            const staleTailIndex = sessions.findIndex((session, index) =>
              index === sessions.length - 1 && Number(session.day) !== targetDay && session.template_id === template.id);
            if (staleTailIndex >= 0) sessions.splice(staleTailIndex, 1);

            const targetIndex = sessions.findIndex(session => Number(session.day) === targetDay);
            if (targetIndex < 0) throw new Error("Sessão ativa não encontrada no programa.");
            sessions[targetIndex] = templateToSession(template, targetDay);
            return sessions;
          };

          export const buildLibraryProgram'''
          if 'replaceActiveSessionWithTemplate' not in text:
              assert template_marker in text, 'templateToSession marker missing'
              text = text.replace(template_marker, template_replacement, 1)

          old_is_applied = '  const isApplied = id => appliedIds.has(id);'
          new_is_applied = '''  const activeTemplateId = useMemo(() => {
            const sessions = program?.sessions || [];
            const activeDay = Number(program?.active_day ?? sessions[0]?.day ?? 1);
            return sessions.find(item => Number(item.day) === activeDay)?.template_id || null;
          }, [program]);
            const isApplied = id => activeTemplateId === id;'''
          assert old_is_applied in text, 'isApplied marker missing'
          text = text.replace(old_is_applied, new_is_applied, 1)

          text = text.replace('setActionMessage(`${template.name} foi adicionado ao seu treino.`);', 'setActionMessage(`${template.name} agora é o seu treino atual.`);')
          text = text.replace('actionMessage.includes("foi adicionado")', 'actionMessage.includes("treino atual")')
          text = text.replace('<><Check size={16}/> No seu treino</>', '<><Check size={16}/> Treino atual</>')
          text = text.replace('<><Plus size={16}/> Adicionar ao treino</>', '<><Plus size={16}/> Usar neste treino</>')
          text = text.replace('"Sessão já está no seu treino"', '"Esta é a sessão atual"')
          text = text.replace('"Usar esta sessão"', '"Usar como treino atual"')
          library.write_text(text, encoding='utf-8')

          app = Path('frontend/src/App.js')
          app_text = app.read_text(encoding='utf-8')
          app_text = app_text.replace('import WorkoutLibrary,{templateToSession} from "./features/WorkoutLibrary";', 'import WorkoutLibrary,{replaceActiveSessionWithTemplate} from "./features/WorkoutLibrary";')

          pattern = re.compile(r'const addLibraryTemplate=async template=>\{.*?\};const openManual=', re.S)
          replacement = '''const addLibraryTemplate=async template=>{const current=db.profile?.custom_program?.sessions?.length?db.profile.custom_program:db.program;const sessions=replaceActiveSessionWithTemplate(current,template,db.program?.active_day);const payload={profile_id:db.profile.id,name:current?.name||"Programa FORGE personalizado",week:current?.week||"Microciclo personalizado",session_minutes:Number(current?.session_minutes||db.profile?.session_minutes||String(current?.duration||"").match(/\\d+/)?.[0]||60),sessions};const response=await axios.post(`${API}/custom-program`,payload);setDb(state=>({...state,program:response.data.program,profile:{...state.profile,custom_program:response.data.custom,automation_mode:"FORGE_PRO"}}));return response.data};const openManual='''
          app_text, count = pattern.subn(replacement, app_text, count=1)
          assert count == 1, f'addLibraryTemplate replacement count={count}'
          app.write_text(app_text, encoding='utf-8')

          tests = Path('frontend/src/features/workoutLibrary.test.js')
          test_text = tests.read_text(encoding='utf-8')
          test_text = test_text.replace('import { buildLibraryProgram, isFemaleProfile, programPhaseToDraft, templateToSession } from "./WorkoutLibrary";', 'import { buildLibraryProgram, isFemaleProfile, programPhaseToDraft, replaceActiveSessionWithTemplate, templateToSession } from "./WorkoutLibrary";')
          if 'replaces the active session instead of appending' not in test_text:
              test_text += '''\n\ntest("replaces the active session instead of appending a hidden workout", () => {\n  const current = { active_day: 2, sessions: [\n    { day: 1, label: "Push 1", exercises: makeTemplate("push-old", "Push old").exercises },\n    { day: 2, label: "Legs 1", exercises: makeTemplate("legs-old", "Legs old").exercises },\n  ] };\n  const next = replaceActiveSessionWithTemplate(current, makeTemplate("legs-quads", "Legs Quadríceps"), 2);\n  expect(next).toHaveLength(2);\n  expect(next[1].day).toBe(2);\n  expect(next[1].label).toBe("Legs Quadríceps");\n  expect(next[1].template_id).toBe("legs-quads");\n});\n\ntest("removes the stale tail copy created by the previous append behavior", () => {\n  const selected = makeTemplate("legs-quads", "Legs Quadríceps");\n  const current = { active_day: 2, sessions: [\n    { day: 1, label: "Push 1", exercises: makeTemplate("push-old", "Push old").exercises },\n    { day: 2, label: "Legs 1", exercises: makeTemplate("legs-old", "Legs old").exercises },\n    templateToSession(selected, 3),\n  ] };\n  const next = replaceActiveSessionWithTemplate(current, selected, 2);\n  expect(next).toHaveLength(2);\n  expect(next.map(item => item.template_id).filter(Boolean)).toEqual(["legs-quads"]);\n  expect(next[1].day).toBe(2);\n});\n'''
          tests.write_text(test_text, encoding='utf-8')

          assert 'replaceActiveSessionWithTemplate(current,template,db.program?.active_day)' in app_text
          assert 'Usar neste treino' in text
          assert 'Treino atual' in text
          PY

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add frontend/src/App.js frontend/src/features/WorkoutLibrary.jsx frontend/src/features/workoutLibrary.test.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(workouts): apply library template to active session"
            git push origin HEAD:fix/library-active-session
          fi
