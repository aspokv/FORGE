name: Verify Runtime Cleanup V3
on:
  push:
    branches: [perf/runtime-cleanup-v3]
permissions:
  contents: write
jobs:
  optimize-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/runtime-cleanup-v3
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Apply runtime cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.js')
          text = app.read_text(encoding='utf-8')

          text = text.replace('import {useEffect,useMemo,useRef,useState} from "react";', 'import {lazy,useEffect,useMemo,useRef,useState} from "react";', 1)
          lazy_imports = {
            'import ProgramBuilder from "./features/ProgramBuilder";': 'const ProgramBuilder=lazy(()=>import("./features/ProgramBuilder"));',
            'import Landing from "./features/Landing";': 'const Landing=lazy(()=>import("./features/Landing"));',
            'import AdminPanel from "./features/AdminPanel";': 'const AdminPanel=lazy(()=>import("./features/AdminPanel"));',
            'import Nutrition from "./features/Nutrition";': 'const Nutrition=lazy(()=>import("./features/Nutrition"));',
            'import Billing from "./features/Billing";': 'const Billing=lazy(()=>import("./features/Billing"));',
            'import ManualWorkout from "./features/ManualWorkout";': 'const ManualWorkout=lazy(()=>import("./features/ManualWorkout"));',
          }
          for old,new in lazy_imports.items():
              assert old in text, old
              text = text.replace(old,new,1)

          marker = 'function Workout({db,techniques,openTech,goHome,onExerciseSubstituted,onWorkoutCompleted,onLibraryBuild,onLibraryTemplateAdd}){'
          assert marker in text
          rest_timer = '''function RestTimer({seconds=0,signal=0}){\n  const[remaining,setRemaining]=useState(0);\n  useEffect(()=>{\n    setRemaining(seconds);\n    if(!seconds)return;\n    const interval=setInterval(()=>setRemaining(value=>Math.max(0,value-1)),1000);\n    return()=>clearInterval(interval);\n  },[seconds,signal]);\n  const active=remaining>0;\n  const total=Math.max(1,seconds);\n  return <div className={active?"rest-banner active":"rest-banner"}data-testid="rest-timer">\n    <div className="rest-label"><TimerReset size={14}/>{active?"Descanso":"Pronto para a próxima série"}</div>\n    <div className="rest-time">{active?`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,"0")}`:"—"}</div>\n    {active&&<div className="rest-bar"><b style={{width:`${100-(remaining/total*100)}%`}}/></div>}\n  </div>;\n}\n'''
          text = text.replace(marker, rest_timer + marker, 1)
          text = text.replace('  const[timer,setTimer]=useState(0);\n  const[timerTotal,setTimerTotal]=useState(0);', '  const[rest,setRest]=useState({seconds:0,signal:0});', 1)
          timer_effect = '  useEffect(()=>{if(!timer)return;const i=setInterval(()=>setTimer(x=>Math.max(0,x-1)),1000);return()=>clearInterval(i)},[timer]);\n'
          assert timer_effect in text
          text = text.replace(timer_effect, '', 1)
          old_mark = 'setTimer(secs);setTimerTotal(secs);'
          assert old_mark in text
          text = text.replace(old_mark, 'setRest(current=>({seconds:secs,signal:current.signal+1}));', 1)
          old_reset = 'setTimer(0);setTimerTotal(0);'
          assert old_reset in text
          text = text.replace(old_reset, 'setRest(current=>({seconds:0,signal:current.signal+1}));', 1)
          old_banner = '''    <div className={timer>0?"rest-banner active":"rest-banner"}data-testid="rest-timer">\n      <div className="rest-label"><TimerReset size={14}/>{timer>0?"Descanso":"Pronto para a próxima série"}</div>\n      <div className="rest-time">{timer>0?`${Math.floor(timer/60)}:${String(timer%60).padStart(2,"0")}`:"—"}</div>\n      {timer>0&&<div className="rest-bar"><b style={{width:`${100-(timer/Math.max(1,timerTotal)*100)}%`}}/></div>}\n    </div>'''
          assert old_banner in text
          text = text.replace(old_banner, '    <RestTimer seconds={rest.seconds} signal={rest.signal}/>', 1)

          old_metrics = '''  const completedEntries=items.flatMap(x=>Array.from({length:x.sets},(_,n)=>({key:x.exercise_id+n,value:setInputs[`${x.exercise_id}-${n}`]}))).filter(x=>done[x.key]);\n  const actualVolume=completedEntries.reduce((sum,x)=>sum+Number(x.value?.weight||0)*Number(x.value?.reps||0),0);\n  const averageRir=completedEntries.length?completedEntries.reduce((sum,x)=>sum+Number(x.value?.rir||0),0)/completedEntries.length:null;'''
          new_metrics = '''  const completedEntries=useMemo(()=>items.flatMap(x=>Array.from({length:x.sets},(_,n)=>({key:x.exercise_id+n,value:setInputs[`${x.exercise_id}-${n}`]}))).filter(x=>done[x.key]),[items,setInputs,done]);\n  const actualVolume=useMemo(()=>completedEntries.reduce((sum,x)=>sum+Number(x.value?.weight||0)*Number(x.value?.reps||0),0),[completedEntries]);\n  const averageRir=useMemo(()=>completedEntries.length?completedEntries.reduce((sum,x)=>sum+Number(x.value?.rir||0),0)/completedEntries.length:null,[completedEntries]);'''
          assert old_metrics in text
          text = text.replace(old_metrics,new_metrics,1)
          app.write_text(text, encoding='utf-8')

          index = Path('frontend/src/index.js')
          idx = index.read_text(encoding='utf-8')
          idx = idx.replace('import React from "react";', 'import React, { Suspense } from "react";', 1)
          old = '''    <QueryClientProvider client={queryClient}>\n      <App />\n    </QueryClientProvider>'''
          new = '''    <QueryClientProvider client={queryClient}>\n      <Suspense fallback={<div className="loading">Carregando FORGE...</div>}>\n        <App />\n      </Suspense>\n    </QueryClientProvider>'''
          assert old in idx
          idx = idx.replace(old,new,1)
          index.write_text(idx, encoding='utf-8')

          muscle = Path('frontend/src/features/MuscleSessionMap.jsx')
          m = muscle.read_text(encoding='utf-8')
          if not m.startswith('import {memo}'):
              m = 'import {memo} from "react";\n' + m
          old = 'export default function MuscleSessionMap({items=[],exercises=[],focus=[],sessionLabel=""}){'
          assert old in m
          m = m.replace(old, 'function MuscleSessionMap({items=[],exercises=[],focus=[],sessionLabel=""}){', 1)
          m = m.rstrip() + '\n\nexport default memo(MuscleSessionMap);\n'
          m = m.replace('<img src={src} alt={side==="front"?"Anatomia frontal":"Anatomia posterior"}/>', '<img src={src} alt={side==="front"?"Anatomia frontal":"Anatomia posterior"} decoding="async"/>', 1)
          muscle.write_text(m, encoding='utf-8')

          anatomy_css = Path('frontend/src/features/anatomy-assets.css')
          ac = anatomy_css.read_text(encoding='utf-8')
          old_filter = 'filter:drop-shadow(0 13px 16px rgba(0,0,0,.5));'
          assert old_filter in ac
          ac = ac.replace(old_filter, 'filter:none;', 1)
          anatomy_css.write_text(ac, encoding='utf-8')

          mobile = Path('frontend/src/mobile-premium.css')
          mc = mobile.read_text(encoding='utf-8')
          mc = mc.replace('background:radial-gradient(circle at 10% 50%,rgba(176,124,78,.14),transparent 34%),linear-gradient(135deg,rgba(25,23,22,.97),rgba(9,10,11,.98));box-shadow:inset 0 1px rgba(255,255,255,.06),0 24px 70px rgba(0,0,0,.28);', 'background:linear-gradient(135deg,rgba(25,23,22,.97),rgba(9,10,11,.98));box-shadow:inset 0 1px rgba(255,255,255,.045),0 10px 24px rgba(0,0,0,.24);', 1)
          mc = mc.replace('box-shadow:0 0 0 30px rgba(203,159,116,.025),0 0 0 62px rgba(203,159,116,.018)', 'box-shadow:none', 1)
          mc = mc.replace('box-shadow:0 0 35px rgba(179,123,75,.14)', 'box-shadow:none', 1)
          mc = mc.replace('box-shadow:0 0 10px #a6cf6d', 'box-shadow:none', 1)
          mobile.write_text(mc, encoding='utf-8')
          PY
      - name: Optimize anatomy assets for mobile density
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root=Path('frontend/public/images/anatomy')
          files=list(root.glob('*.webp'))
          before=sum(p.stat().st_size for p in files)
          changed=0
          for path in files:
              with Image.open(path) as im:
                  original=im.size
                  im.thumbnail((768,768), Image.Resampling.LANCZOS)
                  if im.size != original or path.stat().st_size > 350_000:
                      im.save(path,'WEBP',quality=86,method=6,optimize=True)
                      changed+=1
          after=sum(p.stat().st_size for p in files)
          print(f'ANATOMY_FILES={len(files)} CHANGED={changed}')
          print(f'ANATOMY_BEFORE_BYTES={before}')
          print(f'ANATOMY_AFTER_BYTES={after}')
          print(f'ANATOMY_REDUCTION_PCT={(before-after)/before*100:.1f}')
          PY
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Show bundle files
        working-directory: frontend
        run: |
          echo "JS chunks:"
          find build/static/js -maxdepth 1 -type f -name '*.js' -printf '%f %s bytes\n' | sort -k2 -n
          echo "CSS chunks:"
          find build/static/css -maxdepth 1 -type f -name '*.css' -printf '%f %s bytes\n' | sort -k2 -n
      - name: Commit implementation
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add frontend/src/App.js frontend/src/index.js frontend/src/features/MuscleSessionMap.jsx frontend/src/features/anatomy-assets.css frontend/src/mobile-premium.css frontend/public/images/anatomy
          if ! git diff --cached --quiet; then
            git commit -m "perf(frontend): split heavy screens and isolate workout timer"
            git push origin HEAD:perf/runtime-cleanup-v3
          fi
