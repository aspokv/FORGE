name: Progress Copy Patcher

on:
  push:
    branches:
      - progress-universal-premium-20260904

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: progress-universal-premium-20260904
          fetch-depth: 0
      - name: Patch progress summary integration
        run: |
          python <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.js')
          s = app.read_text(encoding='utf-8')
          anchor = 'import {completeWorkout} from "./features/completeWorkout";\n'
          helper = 'import {buildProgressSummary} from "./features/progressSummary";\n'
          if helper not in s:
              if anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(anchor, anchor + helper, 1)
          old = '''  const heroValue=trendChange==null?(results.length?`${results.length} marcas consolidadas`:"Primeira linha de base criada"):`${trendChange>=0?"+":""}${trendChange.toFixed(1).replace(".",",")}% de carga`;
  const heroCopy=trendChange==null?(results.length?"Seus melhores resultados já estão organizados. A tendência aparece após a próxima semana comparável.":"A próxima sessão começa a transformar execução em tendência."):"Comparação das últimas quatro semanas com registros válidos.";
'''
          new = '  const {eyebrow:heroEyebrow,value:heroValue,copy:heroCopy}=buildProgressSummary({trendChange,resultCount:results.length});\n'
          if old in s:
              s = s.replace(old, new, 1)
          elif new not in s:
              raise SystemExit('progress summary anchors not found')
          old_hero = '    <section className="panel progress-hero"data-testid="progress-hero"><p className="eyebrow">SUA EVOLUÇÃO</p><strong>{heroValue}</strong><p>{heroCopy}</p></section>\n'
          new_hero = '    <section className="panel progress-hero"data-testid="progress-hero"><p className="eyebrow">{heroEyebrow}</p><strong>{heroValue}</strong><p>{heroCopy}</p></section>\n'
          if old_hero in s:
              s = s.replace(old_hero, new_hero, 1)
          elif new_hero not in s:
              raise SystemExit('progress hero anchor not found')
          app.write_text(s, encoding='utf-8')
          css = Path('frontend/src/features/performance-os.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* PROGRESS UNIVERSAL SUMMARY 2026-09-04 */'
          if marker not in c:
              c += '\n\n' + marker + '''
.progress-page .progress-hero{border-color:rgba(201,162,126,.30);background:radial-gradient(circle at 88% 16%,rgba(201,162,126,.12),transparent 30%),linear-gradient(145deg,rgba(255,255,255,.045),rgba(8,9,10,.88))}
.progress-page .progress-hero .eyebrow{color:var(--accent-bright)}
.progress-page .progress-hero strong{display:block;letter-spacing:-.035em}
.progress-page .progress-hero>p:last-child{max-width:680px;color:var(--muted)}
@media(max-width:800px){.progress-page .progress-hero{padding:18px 17px}.progress-page .progress-hero strong{font-size:clamp(26px,7vw,32px);line-height:1.03}.progress-page .progress-hero>p:last-child{margin-top:8px;line-height:1.45}}
'''
              css.write_text(c, encoding='utf-8')
          PY
      - name: Commit integration
        run: |
          git config user.name forge-ci
          git config user.email forge-ci@users.noreply.github.com
          git add frontend/src/App.js frontend/src/features/performance-os.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(progress): replace consolidated marks with universal summary"
          git push origin HEAD:progress-universal-premium-20260904
