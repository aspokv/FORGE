name: Verify Cycle Status And Workout Preview V2

on:
  push:
    branches:
      - ui/cycle-status-workout-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/cycle-status-workout-preview
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Harden mobile preview selector
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          js = Path('frontend/src/features/WorkoutLibrary.jsx')
          text = js.read_text(encoding='utf-8')
          old = 'className={`${active?.id === template.id ? "active " : ""}${isSelected(template.id) || isApplied(template.id) ? "selected" : ""}`}'
          new = 'className={`${active?.id === template.id ? "active " : ""}${previewId === template.id ? "preview-open " : ""}${isSelected(template.id) || isApplied(template.id) ? "selected" : ""}`}'
          assert old in text
          text = text.replace(old, new, 1)
          js.write_text(text, encoding='utf-8')
          css = Path('frontend/src/features/workout-library.css')
          styles = css.read_text(encoding='utf-8')
          assert '.library-card-grid article:has(.library-mobile-session-preview)' in styles
          styles = styles.replace('.library-card-grid article:has(.library-mobile-session-preview)', '.library-card-grid article.preview-open', 1)
          css.write_text(styles, encoding='utf-8')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add frontend/src/features/WorkoutLibrary.jsx frontend/src/features/workout-library.css
          if ! git diff --cached --quiet; then
            git commit -m "fix(ui): harden mobile workout preview selector"
            git push origin HEAD:ui/cycle-status-workout-preview
          fi
