name: Verify Home First Screen
on:
  push:
    branches: [ui/home-fit-first-screen]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Test frontend
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Assert compact Home layer
        run: |
          test -f frontend/src/home-first-screen.css
          grep -q 'home-first-screen.css' frontend/src/index.js
          grep -q 'ref3-hydration' frontend/src/home-first-screen.css
