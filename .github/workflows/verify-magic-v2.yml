name: Verify Magic Patterns V2
on:
  push:
    branches: [ui/magic-patterns-v2]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/magic-patterns-v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Assert Magic V2 layer
        run: |
          grep -q 'magic-patterns-v2.css' frontend/src/index.js
          grep -q -- '--forge-champagne:#e0b685' frontend/src/magic-patterns-v2.css
          grep -q "font-family:'Archivo'" frontend/src/magic-patterns-v2.css
