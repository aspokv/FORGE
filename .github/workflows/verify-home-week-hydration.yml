name: Verify Home Week Hydration

on:
  push:
    branches:
      - feat/home-week-hydration
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/home-week-hydration
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply Home week and hydration feature
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- backend ----------
          server = Path('backend/server.py')
          s = server.read_text(encoding='utf-8')

          if 'class HydrationAddIn(BaseModel):' not in s:
              marker = '\n\nclass TrainingPreferencesIn(BaseModel):'
              assert marker in s, 'TrainingPreferencesIn marker missing'
              s = s.replace(
                  marker,
                  '\n\nclass HydrationAddIn(BaseModel):\n    amount_ml: int = Field(..., ge=50, le=1000)\n' + marker,
                  1,
              )

          if '@api.get("/hydration/{day}")' not in s:
              route_marker = '# Um treino em andamento so vale para a sessao do dia:'
              pos = s.index(route_marker)
              hydration_routes = '''def _valid_hydration_day(day: str) -> str:
              try:
                  parsed = datetime.strptime(day, "%Y-%m-%d")
              except (TypeError, ValueError):
                  raise HTTPException(400, "Data de hidratação inválida")
              if parsed.strftime("%Y-%m-%d") != day:
                  raise HTTPException(400, "Data de hidratação inválida")
              return day


          def _hydration_goal_ml(profile: Dict[str, Any]) -> int:
              try:
                  goal = int(profile.get("hydration_goal_ml") or 2500)
              except (TypeError, ValueError):
                  goal = 2500
              return max(1000, min(6000, goal))


          async def _hydration_snapshot(target: str, day: str) -> Dict[str, Any]:
              entries = await db.hydration_logs.find(
                  {"profile_id": target, "date": day}, {"_id": 0, "amount_ml": 1}
              ).sort("created_at", 1).to_list(length=200)
              total = sum(max(0, int(x.get("amount_ml") or 0)) for x in entries)
              profile = await load_profile(target)
              goal = _hydration_goal_ml(profile)
              return {
                  "date": day,
                  "total_ml": total,
                  "goal_ml": goal,
                  "remaining_ml": max(0, goal - total),
                  "progress_pct": min(100, round(total / goal * 100)) if goal else 0,
                  "can_undo": bool(entries),
              }


          @api.get("/hydration/{day}")
          async def get_hydration(day: str, user=Depends(get_current_user)):
              day = _valid_hydration_day(day)
              return await _hydration_snapshot(user["id"], day)


          @api.post("/hydration/{day}")
          async def add_hydration(day: str, payload: HydrationAddIn,
                                  user=Depends(get_current_user)):
              day = _valid_hydration_day(day)
              target = user["id"]
              snapshot = await _hydration_snapshot(target, day)
              if snapshot["total_ml"] + payload.amount_ml > 10000:
                  raise HTTPException(400, "Limite diário de registro atingido")
              await db.hydration_logs.insert_one({
                  "id": str(uuid.uuid4()),
                  "profile_id": target,
                  "user_id": target,
                  "date": day,
                  "amount_ml": payload.amount_ml,
                  "created_at": datetime.now(timezone.utc).isoformat(),
              })
              return await _hydration_snapshot(target, day)


          @api.delete("/hydration/{day}/last")
          async def undo_hydration(day: str, user=Depends(get_current_user)):
              day = _valid_hydration_day(day)
              target = user["id"]
              last = await db.hydration_logs.find_one(
                  {"profile_id": target, "date": day}, sort=[("created_at", -1)]
              )
              if last:
                  await db.hydration_logs.delete_one({"_id": last["_id"]})
              return await _hydration_snapshot(target, day)


          '''
              s = s[:pos] + hydration_routes + s[pos:]

          server.write_text(s, encoding='utf-8')

          # ---------- frontend ----------
          app = Path('frontend/src/App.js')
          a = app.read_text(encoding='utf-8')

          if 'Droplets,' not in a:
              assert 'Dumbbell,FileUp,Home' in a, 'lucide import marker missing'
              a = a.replace('Dumbbell,FileUp,Home', 'Droplets,Dumbbell,FileUp,Home', 1)

          today_marker = 'function Today({db,analytics,report,start,openCoach,openBuilder,openManual}){'
          today_pos = a.index(today_marker)

          if 'function localDateKey(){' not in a:
              helper = '''function localDateKey(){
            const d=new Date();
            const pad=n=>String(n).padStart(2,"0");
            return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
          }

          '''
              a = a[:today_pos] + helper + a[today_pos:]
              today_pos = a.index(today_marker)

          old_state = '  const[showExercises,setShowExercises]=useState(false),[nutrition,setNutrition]=useState(null),[mealLog,setMealLog]=useState([]);'
          new_state = '  const[showExercises,setShowExercises]=useState(false),[nutrition,setNutrition]=useState(null),[mealLog,setMealLog]=useState([]),[hydration,setHydration]=useState(null),[hydrationBusy,setHydrationBusy]=useState(false);'
          if '[hydration,setHydration]' not in a:
              assert old_state in a, 'Today state marker missing'
              a = a.replace(old_state, new_state, 1)

          if 'axios.get(`${API}/hydration/${today}`)' not in a:
              effect_start = a.index('  useEffect(()=>{let alive=true;const today=', today_pos)
              effect_end = a.index('},[]);', effect_start) + len('},[]);')
              new_effect = '  useEffect(()=>{let alive=true;const today=localDateKey();Promise.allSettled([axios.get(`${API}/nutrition/plan`),axios.get(`${API}/nutrition/adherence/${today}`),axios.get(`${API}/hydration/${today}`)]).then(([n,a,h])=>{if(!alive)return;if(n.status==="fulfilled")setNutrition(n.value.data);if(a.status==="fulfilled")setMealLog(a.value.data.meals||[]);if(h.status==="fulfilled")setHydration(h.value.data)});return()=>{alive=false}},[]);'
              a = a[:effect_start] + new_effect + a[effect_end:]

          if 'const sessions=p.sessions||[];' not in a:
              totals_marker = '  const totalMeals=nutrition?.meals?.length||0;\n'
              totals_pos = a.index(totals_marker, today_pos) + len(totals_marker)
              derived = '''  const sessions=p.sessions||[];
            const foundActive=sessions.findIndex(s=>s.day===p.active_day);
            const activeSessionIndex=sessions.length?Math.max(0,foundActive):-1;
            const completedSessionCount=activeSessionIndex>0?activeSessionIndex:0;
            const shortSessionLabel=(session,index)=>String(session?.label||`Treino ${index+1}`).split(/[—–-]/)[0].trim();
            const waterTotal=Number(hydration?.total_ml||0),waterGoal=Number(hydration?.goal_ml||2500);
            const waterPct=waterGoal?Math.min(100,Math.round(waterTotal/waterGoal*100)):0;
            const waterLiters=(waterTotal/1000).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2});
            const waterGoalLiters=(waterGoal/1000).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1});
            const addWater=async amount=>{if(hydrationBusy)return;const previous=hydration;setHydrationBusy(true);setHydration(h=>({...h,total_ml:Number(h?.total_ml||0)+amount,goal_ml:Number(h?.goal_ml||waterGoal),can_undo:true}));try{const r=await axios.post(`${API}/hydration/${localDateKey()}`,{amount_ml:amount});setHydration(r.data)}catch{setHydration(previous)}finally{setHydrationBusy(false)}};
            const undoWater=async()=>{if(hydrationBusy||!hydration?.can_undo)return;setHydrationBusy(true);try{const r=await axios.delete(`${API}/hydration/${localDateKey()}/last`);setHydration(r.data)}finally{setHydrationBusy(false)}};
          '''
              a = a[:totals_pos] + derived + a[totals_pos:]

          if 'data-testid="home-training-week"' not in a:
              decision_marker = '    <section className="panel ledger-decision" data-testid="daily-briefing">'
              decision_pos = a.index(decision_marker, today_pos)
              week = '''    {sessions.length>0&&<section className="ledger-week" data-testid="home-training-week">
              <div className="ledger-section-head">
                <span className="decision-kicker">Semana em curso</span>
                <span className="ledger-section-note">{completedSessionCount} de {sessions.length} sessões concluídas</span>
              </div>
              <div className="ledger-week-track">
                {sessions.map((session,index)=>{const status=index<activeSessionIndex?"done":index===activeSessionIndex?"current":"next";return <div className={`ledger-week-item ${status}`} key={`${session.day}-${session.label||index}`} data-testid={`week-session-${index+1}`}>
                  <span className="ledger-week-step">{status==="done"?<Check size={13}/>:String(index+1).padStart(2,"0")}</span>
                  <b>{shortSessionLabel(session,index)}</b>
                  <small>{status==="done"?"concluído":status==="current"?"hoje":"próximo"}</small>
                </div>})}
              </div>
            </section>}

          '''
              a = a[:decision_pos] + week + a[decision_pos:]

          if 'data-testid="home-hydration"' not in a:
              session_marker = '    <section className="ledger-session" data-testid="today-workout-card">'
              session_pos = a.index(session_marker, today_pos)
              hydration_block = '''    {hydration&&<section className={`ledger-hydration${waterPct>=100?" complete":""}`} data-testid="home-hydration">
              <div className="ledger-section-head">
                <span className="decision-kicker">Hidratação hoje</span>
                <span className="ledger-section-note">{waterPct>=100?"meta concluída":`faltam ${Math.max(0,waterGoal-waterTotal).toLocaleString("pt-BR")} ml`}</span>
              </div>
              <div className="hydration-main">
                <div className="hydration-value"><Droplets size={18}/><b>{waterLiters}<em> / {waterGoalLiters} L</em></b></div>
                <div className="hydration-track"><i style={{width:`${waterPct}%`}}/></div>
              </div>
              <div className="hydration-actions">
                <button type="button" data-testid="hydration-add-250" disabled={hydrationBusy} onClick={()=>addWater(250)}>+250 ml</button>
                <button type="button" data-testid="hydration-add-500" disabled={hydrationBusy} onClick={()=>addWater(500)}>+500 ml</button>
                <button type="button" className="undo" data-testid="hydration-undo" disabled={hydrationBusy||!hydration.can_undo} onClick={undoWater}>Desfazer</button>
              </div>
            </section>}

          '''
              a = a[:session_pos] + hydration_block + a[session_pos:]

          app.write_text(a, encoding='utf-8')

          # ---------- CSS ----------
          css = Path('frontend/src/iron-ledger-pass-02.css')
          c = css.read_text(encoding='utf-8')
          if '/* ---- semana + hidratação ---- */' not in c:
              c += r'''

          /* ---- semana + hidratação ---- */
          @media (max-width: 800px) {
            .ledger-home .ledger-week {
              margin: 0 0 22px;
              padding: 16px 0 18px;
              border-top: 1px solid rgba(255,255,255,.08);
              border-bottom: 1px solid rgba(255,255,255,.10);
            }
            .ledger-home .ledger-week-track {
              display: flex;
              gap: 8px;
              margin-top: 14px;
              overflow-x: auto;
              overscroll-behavior-x: contain;
              scrollbar-width: none;
              scroll-snap-type: x proximity;
            }
            .ledger-home .ledger-week-track::-webkit-scrollbar { display: none; }
            .ledger-home .ledger-week-item {
              flex: 0 0 112px;
              min-width: 0;
              padding: 11px 10px 10px;
              border: 1px solid #2b2e31;
              border-radius: 10px;
              background: transparent;
              scroll-snap-align: start;
            }
            .ledger-home .ledger-week-step {
              width: 23px;
              height: 23px;
              display: inline-flex;
              align-items: center;
              justify-content: center;
              border: 1px solid #34383d;
              border-radius: 50%;
              font-family: 'IBM Plex Mono', monospace;
              font-size: 10px;
              color: #6f7270;
            }
            .ledger-home .ledger-week-item b {
              display: block;
              margin-top: 9px;
              overflow: hidden;
              font-size: 13px;
              font-weight: 500;
              color: #a7aaa8;
              white-space: nowrap;
              text-overflow: ellipsis;
            }
            .ledger-home .ledger-week-item small {
              display: block;
              margin-top: 4px;
              font-family: 'IBM Plex Mono', monospace;
              font-size: 9px;
              letter-spacing: .08em;
              text-transform: uppercase;
              color: #5f6260;
            }
            .ledger-home .ledger-week-item.done { border-color: rgba(168,198,134,.24); }
            .ledger-home .ledger-week-item.done .ledger-week-step {
              border-color: rgba(168,198,134,.42);
              color: #a8c686;
            }
            .ledger-home .ledger-week-item.done b { color: #9ba792; }
            .ledger-home .ledger-week-item.current {
              border-color: rgba(227,107,77,.58);
              background: rgba(227,107,77,.055);
            }
            .ledger-home .ledger-week-item.current .ledger-week-step {
              border-color: #e36b4d;
              color: #e36b4d;
            }
            .ledger-home .ledger-week-item.current b { color: #f3efe7; }
            .ledger-home .ledger-week-item.current small { color: #e36b4d; }

            .ledger-home .ledger-hydration {
              margin-top: 30px;
              padding-top: 20px;
              border-top: 1px solid rgba(255,255,255,.10);
            }
            .ledger-home .hydration-main { margin-top: 16px; }
            .ledger-home .hydration-value {
              display: flex;
              align-items: center;
              gap: 9px;
              color: #8a8d8a;
            }
            .ledger-home .hydration-value b {
              font-family: 'IBM Plex Mono', monospace;
              font-feature-settings: "tnum" 1;
              font-size: 22px;
              font-weight: 400;
              color: #f3efe7;
            }
            .ledger-home .hydration-value em {
              font-style: normal;
              font-size: 12px;
              color: #6f7270;
            }
            .ledger-home .hydration-track {
              height: 4px;
              margin-top: 12px;
              overflow: hidden;
              background: #2b2e31;
              border-radius: 999px;
            }
            .ledger-home .hydration-track i {
              display: block;
              height: 100%;
              background: #e36b4d;
              border-radius: inherit;
              transition: width .16s ease-out, background-color .16s ease-out;
            }
            .ledger-home .ledger-hydration.complete .hydration-track i { background: #a8c686; }
            .ledger-home .ledger-hydration.complete .hydration-value { color: #a8c686; }
            .ledger-home .hydration-actions {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
              gap: 8px;
              margin-top: 14px;
            }
            .ledger-home .hydration-actions button {
              min-height: 40px;
              padding: 0 10px;
              border: 1px solid #34383d;
              border-radius: 9px;
              background: transparent;
              font-family: 'IBM Plex Mono', monospace;
              font-size: 11px;
              color: #a7aaa8;
            }
            .ledger-home .hydration-actions button:active:not(:disabled) {
              border-color: #5a5f64;
              color: #f3efe7;
            }
            .ledger-home .hydration-actions button.undo { color: #6f7270; }
            .ledger-home .hydration-actions button:disabled { opacity: .38; }
          }

          @media (prefers-reduced-motion: reduce) {
            .ledger-home .hydration-track i { transition: none; }
          }
          '''
              css.write_text(c, encoding='utf-8')

          assert 'data-testid="home-training-week"' in a
          assert 'data-testid="home-hydration"' in a
          assert '@api.post("/hydration/{day}")' in s
          assert '@api.delete("/hydration/{day}/last")' in s
          PY

      - name: Validate backend syntax
        run: python -m compileall -q backend

      - run: corepack enable

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false --passWithNoTests

      - name: Build production frontend
        working-directory: frontend
        run: CI=false yarn build

      - name: Commit implementation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add backend/server.py frontend/src/App.js frontend/src/iron-ledger-pass-02.css
          git commit -m "feat(home): add training sequence and hydration tracker"
          git push origin HEAD:feat/home-week-hydration
