name: Apply Full Reassessment Fix

on:
  push:
    branches:
      - fix/full-reassessment-modes
    paths:
      - .github/scripts/apply_full_reassessment_fix.py
      - .github/workflows/apply-full-reassessment-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/full-reassessment-modes
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Yarn
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Apply reassessment patch
        run: python3 .github/scripts/apply_full_reassessment_fix.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run focused regressions
        working-directory: frontend
        env:
          CI: "true"
        run: yarn test --watchAll=false --runInBand src/features/reassessmentMode.test.js src/features/onboardingResume.test.js src/features/musclePriorities.test.js

      - name: Build production frontend
        working-directory: frontend
        env:
          CI: "true"
        run: yarn build

      - name: Commit verified fix and remove one-shot tooling
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git rm .github/scripts/apply_full_reassessment_fix.py .github/workflows/apply-full-reassessment-fix.yml
          git add frontend/src/App.js frontend/src/features/onboardingResume.js frontend/src/features/reassessmentMode.js frontend/src/features/reassessmentMode.test.js frontend/src/features/performance-os.css
          git commit -m "fix(onboarding): make reassessment complete and separate automation modes"
          git push origin HEAD:fix/full-reassessment-modes
