name: Verify Compact Today Action

on:
  push:
    branches:
      - ui/compact-today-action
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/compact-today-action
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply compact Today action
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # ---------- backend: persist a local-day readiness check-in ----------
          server = Path('backend/server.py')
          s = server.read_text(encoding='utf-8')

          old_recovery_model = '''class Recovery(BaseModel):
              profile_id: str = "demo"
              sleep: int = 4
              energy: int = 4
              motivation: int = 4
              soreness: int = 2
              stress: int = 2
          '''
          new_recovery_model = '''class Recovery(BaseModel):
              profile_id: str = "demo"
              sleep: int = Field(default=4, ge=1, le=5)
              energy: int = Field(default=4, ge=1, le=5)
              motivation: int = Field(default=4, ge=1, le=5)
              soreness: int = Field(default=2, ge=1, le=5)
              stress: int = Field(default=2, ge=1, le=5)
              local_date: Optional[str] = None
          '''
          if 'local_date: Optional[str] = None' not in s:
              assert old_recovery_model in s, 'Recovery model marker missing'
              s = s.replace(old_recovery_model, new_recovery_model, 1)

          old_recovery_route = '''@api.post("/recovery")
          async def log_recovery(item: Recovery, user=Depends(get_current_user)):
              target = user["id"] if user.get("role") == "ATHLETE" else item.profile_id
              doc = item.model_dump()
              doc["profile_id"] = target
              doc["user_id"] = target
              doc["created_at"] = datetime.now(timezone.utc).isoformat()
              await db.recovery.insert_one(doc)
              return {k: v for k, v in doc.items() if k != "_id"}
          '''
          new_recovery_route = '''def _valid_recovery_day(day: str) -> str:
              try:
                  parsed = datetime.strptime(day, "%Y-%m-%d")
              except (TypeError, ValueError):
                  raise HTTPException(400, "Data de check-in inválida")
              if parsed.strftime("%Y-%m-%d") != day:
                  raise HTTPException(400, "Data de check-in inválida")
              return day


          @api.get("/recovery/{day}")
          async def recovery_for_day(day: str, user=Depends(get_current_user)):
              day = _valid_recovery_day(day)
              target = user["id"]
              latest = await db.recovery.find_one(
                  {"profile_id": target, "local_date": day},
                  {"_id": 0}, sort=[("created_at", -1)])
              return {"date": day, "checkin": latest}


          @api.post("/recovery")
          async def log_recovery(item: Recovery, user=Depends(get_current_user)):
              target = user["id"] if user.get("role") == "ATHLETE" else item.profile_id
              doc = item.model_dump()
              doc["profile_id"] = target
              doc["user_id"] = target
              doc["local_date"] = _valid_recovery_day(
                  item.local_date or datetime.now(timezone.utc).strftime("%Y-%m-%d"))
              doc["created_at"] = datetime.now(timezone.utc).isoformat()
              await db.recovery.insert_one(doc)
              clean = {k: v for k, v in doc.items() if k != "_id"}
              profile = await load_profile(target)
              clean["program"] = await build_program(profile)
              return clean
          '''
          if '@api.get("/recovery/{day}")' not in s:
              assert old_recovery_route in s, 'Recovery route marker missing'
              s = s.replace(old_recovery_route, new_recovery_route, 1)

          server.write_text(s, encoding='utf-8')

          # ---------- frontend ----------
          app = Path('frontend/src/App.js')
          a = app.read_text(encoding='utf-8')

          # Parent callback lets the engine-adjusted program replace the stale Home copy
          # without a page reload after check-in.
          old_callback = '''const onWorkoutCompleted=res=>{setDb(x=>({...x,program:res.program}))};return <div className="forge-shell">'''
          new_callback = '''const onWorkoutCompleted=res=>{setDb(x=>({...x,program:res.program}))};const onRecoveryCheckin=res=>{if(res?.program)setDb(x=>({...x,program:res.program}))};return <div className="forge-shell">'''
          if 'const onRecoveryCheckin=' not in a:
              assert old_callback in a, 'AthleteShell callback marker missing'
              a = a.replace(old_callback, new_callback, 1)

          old_page_call_tail = '''onWorkoutCompleted={onWorkoutCompleted}/>}'''
          new_page_call_tail = '''onWorkoutCompleted={onWorkoutCompleted}onRecoveryCheckin={onRecoveryCheckin}/>}'''
          if 'onRecoveryCheckin={onRecoveryCheckin}/>}' not in a:
              assert old_page_call_tail in a, 'Page call marker missing'
              a = a.replace(old_page_call_tail, new_page_call_tail, 1)

          old_page_sig = '''function Page({tab,db,analytics,report,techniques,start,openCoach,openBuilder,openManual,openTech,redo,signOut,user,goHome,onExerciseSubstituted,onWorkoutCompleted})'''
          new_page_sig = '''function Page({tab,db,analytics,report,techniques,start,openCoach,openBuilder,openManual,openTech,redo,signOut,user,goHome,onExerciseSubstituted,onWorkoutCompleted,onRecoveryCheckin})'''
          if new_page_sig not in a:
              assert old_page_sig in a, 'Page signature marker missing'
              a = a.replace(old_page_sig, new_page_sig, 1)

          old_today_call = '''return <Today db={db}analytics={analytics}report={report}start={start}openCoach={openCoach}openBuilder={openBuilder}openManual={openManual}/>'''
          new_today_call = '''return <Today db={db}analytics={analytics}report={report}start={start}openBuilder={openBuilder}openManual={openManual}onRecoveryCheckin={onRecoveryCheckin}/>'''
          if new_today_call not in a:
              assert old_today_call in a, 'Today call marker missing'
              a = a.replace(old_today_call, new_today_call, 1)

          old_today_sig = '''function Today({db,analytics,report,start,openCoach,openBuilder,openManual}){'''
          new_today_sig = '''function Today({db,analytics,report,start,openBuilder,openManual,onRecoveryCheckin}){'''
          if new_today_sig not in a:
              assert old_today_sig in a, 'Today signature marker missing'
              a = a.replace(old_today_sig, new_today_sig, 1)

          old_state = '''  const[showExercises,setShowExercises]=useState(false),[nutrition,setNutrition]=useState(null),[mealLog,setMealLog]=useState([]),[hydration,setHydration]=useState(null),[hydrationBusy,setHydrationBusy]=useState(false);
            useEffect(()=>{let alive=true;const today=localDateKey();Promise.allSettled([axios.get(`${API}/nutrition/plan`),axios.get(`${API}/nutrition/adherence/${today}`),axios.get(`${API}/hydration/${today}`)]).then(([n,a,h])=>{if(!alive)return;if(n.status==="fulfilled")setNutrition(n.value.data);if(a.status==="fulfilled")setMealLog(a.value.data.meals||[]);if(h.status==="fulfilled")setHydration(h.value.data)});return()=>{alive=false}},[]);
          '''
          new_state = '''  const[showExercises,setShowExercises]=useState(false),[nutrition,setNutrition]=useState(null),[mealLog,setMealLog]=useState([]),[hydration,setHydration]=useState(null),[hydrationBusy,setHydrationBusy]=useState(false),[checkin,setCheckin]=useState(null),[checkinOpen,setCheckinOpen]=useState(false),[checkinBusy,setCheckinBusy]=useState(false),[checkinForm,setCheckinForm]=useState({sleep:4,energy:4,motivation:4,soreness:2,stress:2});
            useEffect(()=>{let alive=true;const today=localDateKey();Promise.allSettled([axios.get(`${API}/nutrition/plan`),axios.get(`${API}/nutrition/adherence/${today}`),axios.get(`${API}/hydration/${today}`),axios.get(`${API}/recovery/${today}`)]).then(([n,a,h,r])=>{if(!alive)return;if(n.status==="fulfilled")setNutrition(n.value.data);if(a.status==="fulfilled")setMealLog(a.value.data.meals||[]);if(h.status==="fulfilled")setHydration(h.value.data);if(r.status==="fulfilled")setCheckin(r.value.data?.checkin||null)});return()=>{alive=false}},[]);
          '''
          if '[checkin,setCheckin]' not in a:
              assert old_state in a, 'Today state marker missing'
              a = a.replace(old_state, new_state, 1)

          old_recovery_copy = '''  const logs=db.recent_sets||[];
            const recoveryLevel=p.logic?.recovery_level;
            const recoveryLabel={HIGH:"Alta",NORMAL:"Boa",LOW:"Baixa",VERY_LOW:"Muito baixa"}[recoveryLevel]||"Sem check-in";
            const recoveryState=!recoveryLevel?"pending":(recoveryLevel==="LOW"||recoveryLevel==="VERY_LOW")?"low":"ok";
            const recoveryAction={HIGH:"Aproveite a prontidão: execute as progressões previstas.",NORMAL:"Siga a prescrição e preserve o RIR planejado.",LOW:"Mantenha carga e priorize execução limpa.",VERY_LOW:"Reduza a ambição de carga e proteja a técnica."}[recoveryLevel]||"Faça o check-in para o plano ajustar a sessão.";
            const hour=new Date().getHours(),greeting=hour<12?"Bom dia":hour<18?"Boa tarde":"Boa noite";
            const rawName=(db.profile?.name||"").trim().split(" ")[0];
            const firstName=(!rawName||rawName.toLowerCase()==="novo")?"":rawName;
            const briefing=recoveryLevel==="VERY_LOW"?`Hoje, vencer é treinar com inteligência. ${recoveryAction}`:`${sessionName} está pronto. ${recoveryAction}`;
          '''
          new_recovery_copy = '''  const logs=db.recent_sets||[];
            const hour=new Date().getHours(),greeting=hour<12?"Bom dia":hour<18?"Boa tarde":"Boa noite";
            const rawName=(db.profile?.name||"").trim().split(" ")[0];
            const firstName=(!rawName||rawName.toLowerCase()==="novo")?"":rawName;
          '''
          if 'const briefing=' in a:
              assert old_recovery_copy in a, 'Old daily briefing variables marker missing'
              a = a.replace(old_recovery_copy, new_recovery_copy, 1)

          hydration_helpers = '''  const addWater=async amount=>{if(hydrationBusy)return;const previous=hydration;setHydrationBusy(true);setHydration(h=>({...h,total_ml:Number(h?.total_ml||0)+amount,goal_ml:Number(h?.goal_ml||waterGoal),can_undo:true}));try{const r=await axios.post(`${API}/hydration/${localDateKey()}`,{amount_ml:amount});setHydration(r.data)}catch{setHydration(previous)}finally{setHydrationBusy(false)}};
            const undoWater=async()=>{if(hydrationBusy||!hydration?.can_undo)return;setHydrationBusy(true);try{const r=await axios.delete(`${API}/hydration/${localDateKey()}/last`);setHydration(r.data)}finally{setHydrationBusy(false)}};
          '''
          checkin_helpers = hydration_helpers + '''  const checkinScore=checkin?Number(checkin.energy||3)*2-Number(checkin.stress||2)-Number(checkin.soreness||2):null;
            const checkinLabel=checkinScore==null?null:checkinScore>=7?"Alta":checkinScore<3?"Muito baixa":checkinScore<4.5?"Baixa":"Boa";
            const checkinMetrics=[["sleep","Sono"],["energy","Energia"],["motivation","Motivação"],["soreness","Dor muscular"],["stress","Estresse"]];
            const setCheckinValue=(key,value)=>setCheckinForm(x=>({...x,[key]:value}));
            const submitCheckin=async()=>{if(checkinBusy)return;setCheckinBusy(true);try{const r=await axios.post(`${API}/recovery`,{profile_id:db.profile?.id,local_date:localDateKey(),...checkinForm});setCheckin(r.data);onRecoveryCheckin?.(r.data);setCheckinOpen(false)}finally{setCheckinBusy(false)}};
          '''
          if 'const submitCheckin=async()' not in a:
              assert hydration_helpers in a, 'Hydration helper marker missing'
              a = a.replace(hydration_helpers, checkin_helpers, 1)

          old_decision = '''    <section className="panel ledger-decision" data-testid="daily-briefing">
              <span className="decision-kicker">Direção de hoje</span>
              <h3 className="ledger-headline">{briefing}</h3>

              <div className="ledger-metrics">
                <div><span>recuperação</span><b className={`ledger-state ${recoveryState}`}>{recoveryLabel}</b></div>
                <div><span>séries</span><b>{plannedSets||"—"}</b></div>
                <div><span>estimado</span><b>{duration}</b></div>
              </div>

              <button className="primary-button command-start" data-testid="start-workout-button" onClick={start}>Começar treino <ChevronRight size={19}/></button>
              <button className="ledger-secondary" data-testid="open-coach-button" onClick={openCoach}>Entender esta decisão <ChevronRight size={15}/></button>
            </section>
          '''
          new_decision = '''    <section className={`today-action-bar${checkin?" checked":""}`} data-testid="daily-briefing">
              <div className="today-action-top">
                <b>{sessionName}</b><span>HOJE</span>
              </div>
              <div className="today-action-detail">
                <span>{plannedSets||"—"} séries · {duration}</span>
                <span className={`today-checkin-badge${checkin?" done":" pending"}`}><i/>{checkin?`Recuperação: ${checkinLabel?.toLowerCase()||"registrada"}`:"Check-in pendente"}</span>
              </div>
              <div className="today-action-actions">
                {checkin?<button className="primary-button today-action-primary" data-testid="start-workout-button" onClick={start}>Começar treino <ChevronRight size={18}/></button>:<>
                  <button className="primary-button today-action-primary" data-testid="checkin-primary-button" onClick={()=>setCheckinOpen(true)}>Fazer check-in <ChevronRight size={18}/></button>
                  <button className="today-action-direct" data-testid="start-workout-button" onClick={start}>Começar direto <ChevronRight size={14}/></button>
                </>}
              </div>
            </section>

            {checkinOpen&&<div className="today-checkin-backdrop" onClick={()=>!checkinBusy&&setCheckinOpen(false)}>
              <section className="today-checkin-modal" role="dialog" aria-modal="true" aria-label="Check-in de prontidão" onClick={e=>e.stopPropagation()} data-testid="today-checkin-modal">
                <div className="today-checkin-head"><div><span>CHECK-IN DE PRONTIDÃO</span><h3>Como você chega hoje?</h3></div><button type="button" aria-label="Fechar" disabled={checkinBusy} onClick={()=>setCheckinOpen(false)}><X size={18}/></button></div>
                <div className="today-checkin-grid">
                  {checkinMetrics.map(([key,label])=><div className="today-checkin-row" key={key}><span>{label}</span><div>{[1,2,3,4,5].map(value=><button type="button" key={value} className={checkinForm[key]===value?"active":""} onClick={()=>setCheckinValue(key,value)}>{value}</button>)}</div></div>)}
                </div>
                <p className="today-checkin-scale">1 = baixo · 5 = alto. Para dor muscular e estresse, 5 significa maior nível.</p>
                <button className="primary-button today-checkin-save" data-testid="save-today-checkin" disabled={checkinBusy} onClick={submitCheckin}>{checkinBusy?"Salvando…":"Salvar check-in"} <ChevronRight size={18}/></button>
              </section>
            </div>}
          '''
          if 'className={`today-action-bar' not in a:
              assert old_decision in a, 'Ledger decision block marker missing'
              a = a.replace(old_decision, new_decision, 1)

          app.write_text(a, encoding='utf-8')

          # ---------- CSS: the Home action becomes a compact execution bar ----------
          css = Path('frontend/src/iron-ledger-pass-02.css')
          c = css.read_text(encoding='utf-8')
          marker = '/* ---- compact today action ---- */'
          if marker not in c:
              c += r'''

          /* ---- compact today action ---- */
          .ledger-home .today-action-bar {
            margin: 0;
            padding: 14px 15px;
            border: 1px solid #34383d;
            border-radius: 12px;
            background: #141619;
            box-shadow: none;
          }
          .ledger-home .today-action-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          }
          .ledger-home .today-action-top b {
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: var(--forge-editorial);
            font-size: 20px;
            font-weight: 500;
            letter-spacing: -.02em;
            color: #f3efe7;
          }
          .ledger-home .today-action-top > span {
            flex: 0 0 auto;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: .16em;
            color: #e36b4d;
          }
          .ledger-home .today-action-detail {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 7px 12px;
            margin-top: 7px;
            font-size: 12px;
            color: #777b79;
          }
          .ledger-home .today-checkin-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            letter-spacing: .03em;
            white-space: nowrap;
          }
          .ledger-home .today-checkin-badge i {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
          }
          .ledger-home .today-checkin-badge.pending { color: #d7a85c; }
          .ledger-home .today-checkin-badge.done { color: #a8c686; }
          .ledger-home .today-action-actions {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto;
            align-items: center;
            gap: 12px;
            margin-top: 13px;
          }
          .ledger-home .today-action-bar.checked .today-action-actions { grid-template-columns: 1fr; }
          .ledger-home .today-action-primary {
            min-height: 44px !important;
            margin: 0 !important;
            border-radius: 9px !important;
            background: #e36b4d !important;
            border-color: #e36b4d !important;
            color: #1c120f !important;
            box-shadow: none !important;
            font-size: 14px !important;
            font-weight: 600 !important;
          }
          .ledger-home .today-action-direct {
            min-height: 38px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border: 0;
            background: transparent;
            color: #8b8e8c;
            font-size: 12px;
            white-space: nowrap;
          }
          .ledger-home .today-action-direct:active { color: #f3efe7; }

          .today-checkin-backdrop {
            position: fixed;
            inset: 0;
            z-index: 1400;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 18px;
            background: rgba(0,0,0,.72);
          }
          .today-checkin-modal {
            width: min(100%, 520px);
            max-height: calc(100dvh - 36px);
            overflow-y: auto;
            padding: 20px;
            border: 1px solid #34383d;
            border-radius: 16px;
            background: #141619;
            box-shadow: 0 20px 54px rgba(0,0,0,.52);
          }
          .today-checkin-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
          }
          .today-checkin-head span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9px;
            letter-spacing: .18em;
            color: #e36b4d;
          }
          .today-checkin-head h3 {
            margin: 5px 0 0;
            font-family: var(--forge-editorial);
            font-size: 25px;
            font-weight: 500;
            color: #f3efe7;
          }
          .today-checkin-head > button {
            width: 34px;
            height: 34px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #34383d;
            border-radius: 9px;
            background: transparent;
            color: #8b8e8c;
          }
          .today-checkin-grid { margin-top: 18px; }
          .today-checkin-row {
            display: grid;
            grid-template-columns: minmax(92px, 1fr) auto;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            border-top: 1px solid rgba(255,255,255,.07);
          }
          .today-checkin-row > span { font-size: 13px; color: #b6b3ad; }
          .today-checkin-row > div { display: flex; gap: 5px; }
          .today-checkin-row button {
            width: 32px;
            height: 32px;
            padding: 0;
            border: 1px solid #34383d;
            border-radius: 8px;
            background: transparent;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 11px;
            color: #747876;
          }
          .today-checkin-row button.active {
            border-color: #e36b4d;
            background: rgba(227,107,77,.09);
            color: #f0b09d;
          }
          .today-checkin-scale {
            margin: 13px 0 0;
            font-size: 10px;
            line-height: 1.45;
            color: #646765;
          }
          .today-checkin-save {
            width: 100%;
            min-height: 46px !important;
            margin-top: 16px !important;
            border-radius: 9px !important;
            background: #e36b4d !important;
            border-color: #e36b4d !important;
            color: #1c120f !important;
            box-shadow: none !important;
          }

          @media (min-width: 801px) {
            .ledger-home .today-action-bar { max-width: 760px; }
            .today-checkin-backdrop { align-items: center; }
          }

          @media (max-width: 390px) {
            .ledger-home .today-action-actions { gap: 8px; }
            .ledger-home .today-action-direct { font-size: 11px; }
            .today-checkin-modal { padding: 17px 15px; }
            .today-checkin-row { grid-template-columns: 80px minmax(0,1fr); gap: 8px; }
            .today-checkin-row > div { justify-content: flex-end; gap: 4px; }
            .today-checkin-row button { width: 30px; height: 30px; }
          }
          '''
              css.write_text(c, encoding='utf-8')

          assert 'className={`today-action-bar' in a
          assert 'data-testid="today-checkin-modal"' in a
          assert '@api.get("/recovery/{day}")' in s
          assert 'local_date: Optional[str] = None' in s
          PY

      - name: Validate backend syntax
        run: python -m py_compile backend/server.py backend/engine.py

      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        working-directory: frontend
        run: CI=true yarn test --watchAll=false

      - name: Build production frontend
        working-directory: frontend
        run: CI=false yarn build

      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add backend/server.py frontend/src/App.js frontend/src/iron-ledger-pass-02.css
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "ui(home): replace decision card with compact action bar"
            git push origin HEAD:ui/compact-today-action
          fi
