name: Verify UI Gutters

on:
  push:
    branches:
      - ui/tighter-mobile-gutters-v3
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - name: Test anatomy mapping
        run: CI=true yarn test --watchAll=false --runInBand MuscleSessionMap.test.js
      - name: Build production frontend
        run: CI=false yarn build
