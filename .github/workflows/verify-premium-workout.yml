name: Verify Premium Workout

on:
  push:
    branches:
      - feat/premium-workout-redesign
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Test dynamic anatomy
        run: CI=true yarn test --watchAll=false --runInBand MuscleSessionMap.test.js

      - name: Build production frontend
        run: yarn build
