name: Verify Workout Artwork
on:
  push:
    branches: [fix/workout-exercise-art]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Assert artwork assets and mapping
        run: |
          test -f frontend/public/images/reference/workout-exercises-sprite.webp
          grep -q 'Remada apoiada no peito' frontend/src/features/exerciseArtwork.test.js
          grep -q 'Rosca direta com barra' frontend/src/features/exerciseArtwork.test.js
          grep -q 'workout-exercises-sprite.webp' frontend/src/features/ReferenceWorkoutPreview.jsx
          ! grep -q "background-image:url('/images/reference/workout-exercises-sprite.webp')" frontend/src/features/exercise-artwork.css
