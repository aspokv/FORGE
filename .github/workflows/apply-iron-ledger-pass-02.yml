name: Apply Iron Ledger Pass 02

on:
  push:
    branches:
      - design/iron-ledger-pass-02
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/iron-ledger-pass-02
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Apply exact Today replacement from Iron Ledger Pass 02
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          path = Path('frontend/src/App.js')
          source = path.read_text(encoding='utf-8')
          if 'function MacroRail({label,value,goal,unit="g"}){' not in source:
              marker = 'function Today({db,analytics,report,start,openCoach,openBuilder,openManual}){'
              start = source.index(marker)
              end = source.index('const LOAD_LABEL=', start)
              encoded = ''''''
              replacement = base64.b64decode(encoded).decode('utf-8')
              source = source[:start] + replacement + source[end:]
              path.write_text(source, encoding='utf-8')
          PY
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: frontend
      - name: Build production frontend
        run: CI=false yarn build
        working-directory: frontend
      - name: Commit App.js replacement when needed
        shell: bash
        run: |
          git config user.name "forge-ci"
          git config user.email "forge-ci@users.noreply.github.com"
          git add frontend/src/App.js
          if ! git diff --cached --quiet; then
            git commit -m "design: pass 02 — home em painel único, faixa de macros, camada semântica"
            git push origin HEAD:design/iron-ledger-pass-02
          fi
