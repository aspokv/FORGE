name: Verify Reference Exact V3
on:
  push:
    branches: [ui/reference-exact-home-workout-v2]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/reference-exact-home-workout-v2
          fetch-depth: 0
      - name: Apply exact reference wiring
        run: python scripts/apply_reference_exact_v3.py
      - name: Commit wired production files
        run: |
          git config user.name "forge-ui-bot"
          git config user.email "forge-ui-bot@users.noreply.github.com"
          git add frontend/src/App.js frontend/src/index.js frontend/src/features/ReferenceHome.jsx frontend/src/reference-exact-v3.css
          if ! git diff --cached --quiet; then
            git commit -m "feat(ui): wire exact approved Home and Workout"
            git push origin HEAD:ui/reference-exact-home-workout-v2
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Run frontend tests
        working-directory: frontend
        env:
          CI: true
        run: yarn test --watchAll=false
      - name: Build production frontend
        working-directory: frontend
        env:
          CI: false
        run: yarn build
      - name: Assert exact reference assets
        run: |
          test -f frontend/public/images/reference/exercise-1.jpg
          test -f frontend/public/images/reference/exercise-5.jpg
          grep -q 'ReferenceHome' frontend/src/App.js
          grep -q 'ReferenceWorkoutPreview' frontend/src/App.js
          grep -q 'reference-exact-v3.css' frontend/src/index.js
          ! grep -q 'ad-reference-home-workout.css' frontend/src/index.js
