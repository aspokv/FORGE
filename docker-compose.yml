# FORGE — stack completa para Coolify (VPS)
#
# Topologia: UM unico dominio publico.
#   frontend (nginx) serve o SPA em /  e faz proxy de /api -> backend:8000
#   backend  (FastAPI) nao fica exposto na internet, so na rede interna do Docker
#   banco    permanece no MongoDB Atlas (nao sobe para a VPS)
#
# No Coolify: New Resource -> Docker Compose -> repositorio aspokv/FORGE, branch main.
# Aponte o dominio APENAS para o servico "frontend", porta 80.

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      MONGO_URL: ${MONGO_URL:?defina MONGO_URL (a mesma string do Atlas usada no Railway)}
      DB_NAME: ${DB_NAME:?defina DB_NAME (o mesmo do Railway, senao o app sobe com banco vazio)}
      FORGE_JWT_SECRET: ${FORGE_JWT_SECRET:?copie o secret ATUAL do Railway, nao gere outro}
      FORGE_SUPER_ADMIN_EMAIL: ${FORGE_SUPER_ADMIN_EMAIL:?defina FORGE_SUPER_ADMIN_EMAIL}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Front e API na mesma origem: CORS deixa de existir como problema.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # --- Cobranca e e-mail ---------------------------------------------------------
      # Variavel definida no painel do Coolify que NAO estiver listada aqui simplesmente
      # nao entra no container: o compose declara o que passa. Todas usam ":-" (opcional,
      # vazio por padrao) e nao ":?" (obrigatorio) para o app continuar subindo sem elas —
      # que e exatamente o estado enquanto a cobranca nao esta configurada.
      MP_ENVIRONMENT: ${MP_ENVIRONMENT:-sandbox}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      MP_ESSENTIAL_PLAN_ID: ${MP_ESSENTIAL_PLAN_ID:-}
      MP_PRO_PLAN_ID: ${MP_PRO_PLAN_ID:-}
      MP_ELITE_PLAN_ID: ${MP_ELITE_PLAN_ID:-}
      FORGE_SITE_URL: ${FORGE_SITE_URL:-https://forge.aiexec.com.br}
      # Padroes conservadores: sem estas definidas, ninguem e bloqueado por falta de
      # assinatura e o cadastro publico continua desligado.
      BILLING_ENFORCED: ${BILLING_ENFORCED:-false}
      BILLING_GRANDFATHER_BEFORE: ${BILLING_GRANDFATHER_BEFORE:-}
      PUBLIC_SIGNUP_ENABLED: ${PUBLIC_SIGNUP_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FORGE_EMAIL_FROM: ${FORGE_EMAIL_FROM:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

